name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Builds the docs so a broken build fails CI. They aren't published: the
    # Python docs live at docs.segmind.com.
    # Pinned: the docs build on Python 3.9, which ubuntu-latest's newer images
    # can't install.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install sphinx sphinx_rtd_theme

    - name: Build documentation
      run: |
        cd docs
        make html
